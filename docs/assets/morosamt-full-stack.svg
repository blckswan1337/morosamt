<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600"><rect width="2400" height="1600" fill="#0b0f12"/><style>.t{font-family:Arial,sans-serif;fill:#fff}.y{fill:#f7c90d}.p{fill:#11181d;stroke:#2c5878;stroke-width:3}.b{fill:#0d4d87}.g{fill:#184d28}.a{fill:#5a4300}.r{fill:#7e1717}.h{font-size:34px;font-weight:700}.s{font-size:22px}.m{font:21px monospace;fill:#dce7ec}</style><text x="70" y="88" class="t y" font-size="54" font-weight="700">MOROSAMT</text><text x="410" y="88" class="t h">SLIK FUNGERER HELE SULAMITTEN</text><text x="72" y="130" class="t s">Fra scooter til firmware via BLE, XBOT og lokal server</text><g class="t"><rect x="40" y="170" rx="22" width="1150" height="420" class="p"/><rect x="58" y="188" rx="12" width="410" height="54" class="b"/><text x="80" y="226" class="h">1  OVERSIKT – HELE KJEDEN</text><text x="95" y="300" class="h">SCOOTER</text><text x="330" y="300" class="h">BLE / NUS</text><text x="655" y="300" class="h">ANDROID / XBOT</text><text x="945" y="300" class="h">LOKAL SERVER</text><rect x="88" y="340" rx="18" width="150" height="150" class="g"/><text x="112" y="410" class="h">HB</text><text x="107" y="445" class="s">controller</text><rect x="322" y="328" rx="16" width="245" height="185" class="b"/><text x="352" y="370" class="h">NUS</text><text x="345" y="405" class="m">6E400001-...</text><text x="345" y="438" class="m">RX 6E400002-...</text><text x="345" y="471" class="m">TX 6E400003-...</text><text x="345" y="503" class="m">XOR 0x34</text><rect x="670" y="340" rx="18" width="175" height="150" class="b"/><text x="712" y="402" class="h">XBOT</text><text x="690" y="440" class="s">Forced upgrade</text><rect x="930" y="328" rx="18" width="210" height="185" class="p"/><text x="957" y="370" class="m">127.0.0.1:8765</text><text x="960" y="408" class="m">/f/MORO42001/</text><text x="980" y="445" class="m">Config.xml</text><text x="980" y="478" class="m">DK01.bin</text><text x="82" y="552" class="s">Controller → BLE → XBOT → lokal HTTP → firmwarefil</text><rect x="1210" y="170" rx="22" width="1150" height="420" class="p"/><rect x="1228" y="188" rx="12" width="500" height="54" class="b"/><text x="1250" y="226" class="h">2  BLE – TRANSPORT OG PROTOKOLL</text><text x="1250" y="295" class="h">Nordic UART Service</text><rect x="1265" y="335" rx="14" width="220" height="90" class="b"/><text x="1325" y="390" class="h">WRITE / RX</text><rect x="1265" y="455" rx="14" width="220" height="90" class="g"/><text x="1305" y="510" class="h">NOTIFY / TX</text><rect x="1615" y="330" rx="16" width="260" height="220" class="p"/><text x="1655" y="380" class="h">XOR 0x34</text><text x="1650" y="422" class="s">Hver byte XOR-es</text><text x="1650" y="455" class="s">i begge retninger.</text><text x="1650" y="500" class="m">12 34 56</text><text x="1650" y="530" class="m">26 00 62</text><rect x="1940" y="325" rx="18" width="365" height="230" class="a"/><text x="1970" y="375" class="h">VIKTIG</text><text x="1970" y="420" class="s">GATT status=0 betyr at</text><text x="1970" y="455" class="s">Android godtok write.</text><text x="1970" y="490" class="s">Det beviser ikke at</text><text x="1970" y="525" class="s">controlleren endret noe.</text><rect x="40" y="620" rx="22" width="1150" height="400" class="p"/><rect x="58" y="638" rx="12" width="490" height="54" class="b"/><text x="80" y="676" class="h">3  REGISTER – SCOOTERIII / HB</text><text x="82" y="740" class="h">Register</text><text x="290" y="740" class="h">Funksjon</text><text x="665" y="740" class="h">Resultat</text><text x="90" y="808" class="m">F3</text><text x="290" y="808" class="s">Speed limit, direkte uint16</text><text x="665" y="808" class="s">30000 = 30.0 km/t ✓</text><text x="90" y="858" class="m">C2/C4/C6</text><text x="290" y="858" class="s">Profilgrenser</text><text x="665" y="858" class="s">Høyere verdier avvist ✕</text><text x="90" y="908" class="m">0x72</text><text x="290" y="908" class="s">Limiter state</text><text x="665" y="908" class="s">Readback uendret ✕</text><text x="90" y="958" class="m">EE</text><text x="290" y="958" class="s">Wheel factor</text><text x="665" y="958" class="s">226 → 225 på readback ✕</text><rect x="1210" y="620" rx="22" width="1150" height="400" class="p"/><rect x="1228" y="638" rx="12" width="580" height="54" class="b"/><text x="1250" y="676" class="h">4  XBOT FORCED UPGRADE – HTTP FLOW</text><rect x="1270" y="740" rx="16" width="165" height="165" class="b"/><text x="1310" y="828" class="h">XBOT</text><rect x="1950" y="720" rx="18" width="330" height="220" class="p"/><text x="1990" y="765" class="m">127.0.0.1:8765</text><text x="1990" y="812" class="m">/f/MORO42001/</text><text x="2020" y="850" class="m">Config.xml</text><text x="2020" y="885" class="m">DK01.bin</text><text x="1510" y="770" class="s">1. GET Config.xml →</text><text x="1510" y="845" class="s">2. GET DK01.bin →</text><text x="1508" y="930" class="s">HTTP 200 = nedlasting, ikke bevis på flash.</text><rect x="40" y="1050" rx="22" width="760" height="400" class="p"/><rect x="58" y="1068" rx="12" width="610" height="54" class="b"/><text x="80" y="1106" class="h">5  FIRMWAREFIL OG VERIFISERING</text><text x="85" y="1170" class="s">Verifisert V2 Pro LR:</text><text x="85" y="1215" class="m">DK061007f9.bin</text><text x="85" y="1255" class="m">28 444 bytes</text><text x="85" y="1295" class="m">SHA-256</text><text x="85" y="1330" class="s">856c19b176f9e8d1f73f627e731e4a991282c9fba2a136b14651831b981bff62</text><rect x="85" y="1360" rx="12" width="640" height="60" class="g"/><text x="110" y="1400" class="h">✓ Sjekk alltid hash + størrelse</text><rect x="830" y="1050" rx="22" width="760" height="400" class="p"/><rect x="848" y="1068" rx="12" width="665" height="54" class="b"/><text x="870" y="1106" class="h">6  OPPDATERINGSPROSESS I CONTROLLEREN</text><text x="885" y="1180" class="s">enter update mode → cmd 7 metadata</text><text x="885" y="1250" class="s">cmd 8 chunks → ACK / retry</text><text x="885" y="1320" class="s">cmd 9 ending metadata → cmd 10 finish</text><rect x="870" y="1360" rx="12" width="675" height="60" class="a"/><text x="895" y="1398" class="s">ACK-state-machine er delvis reverse-engineered.</text><rect x="1620" y="1050" rx="22" width="740" height="400" class="p"/><rect x="1638" y="1068" rx="12" width="610" height="54" class="b"/><text x="1660" y="1106" class="h">7  VERKTØY – TRE ENKLE KOMMANDOER</text><rect x="1660" y="1160" rx="14" width="650" height="70" class="g"/><text x="1690" y="1205" class="h">run</text><text x="1810" y="1205" class="s">autodeteksjon + guide</text><rect x="1660" y="1250" rx="14" width="650" height="70" class="b"/><text x="1690" y="1295" class="h">status</text><text x="1840" y="1295" class="s">profil, server, capture</text><rect x="1660" y="1340" rx="14" width="650" height="70" class="r"/><text x="1690" y="1385" class="h">restore</text><text x="1855" y="1385" class="s">stopp + original XBOT</text><rect x="40" y="1490" rx="14" width="2320" height="75" class="r"/><text x="72" y="1538" class="h">ADVARSEL: Feil firmware kan bricke controlleren. Bruk kun verifisert image for nøyaktig controller-ID.</text></g></svg>